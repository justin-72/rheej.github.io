<!DOCTYPE html>
<html>
<head>
<title>Justin's Desktop Portfolio</title>
<style>

body {
  background-color: #1e1e1e;
  font-family: Arial, sans-serif;
  margin: 0;
}
a { text-decoration: none; }

.desktop {
  position: absolute;
  left: 0px;
  top: 0px;
  width: 100%;
  height: 100%;
  background-image: url("wallpaper.jpeg");
 background-repeat: no-repeat; 
 background-size: cover;
  overflow: hidden;
}

.menubar {
  height: 24px;
  background-color: rgba(0, 0, 0, 0.5);
  color: white;
  font-size: 12px;
  line-height: 24px;
  padding-left: 14px;
}

.menubar span {
  margin-right: 16px;
}

.folders {
  position: absolute;
  right: 20px;
  top: 40px;
  width: 170px;
}

.folder-link {
  float: left;
  width: 64px;
  height: 52px;
  padding: 6px;
  margin: 0px 4px 12px 4px;
  border-radius: 8px;
}

.folder-link:hover {
  background-color: rgba(255, 255, 255, 0.2);
}

.piece:hover {
  scale
}

.folder {
  position: relative;
  width: 50px;
  height: 36px;
  margin: 10px auto 0px auto;
  background-color: #6db8f0;
  border-radius: 4px 6px 6px 6px;
  box-shadow: 0px 3px 6px rgba(0, 0, 0, 0.4);
}

.tab {
  position: absolute;
  top: -6px;
  left: 0px;
  width: 22px;
  height: 8px;
  background-color: #4f9fe0;
  border-radius: 4px 4px 0px 0px;
}

.window {
  display: none;
  position: absolute;
  left: 80px;
  top: 70px;
  width: 440px;
  height: 280px;
  background-color: #3a3a3f;
  border-radius: 10px;
  box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.7);
}

.window:target {
  display: block;
}

.titlebar {
  height: 30px;
  background-color: #5a5a60;
  border-radius: 10px 10px 0px 0px;
  color: white;
  font-size: 13px;
  line-height: 30px;
  text-align: center;
}

.dot {
  float: left;
  width: 12px;
  height: 12px;
  margin: 9px 0px 0px 8px;
  border-radius: 50%;
}

.red    { background-color: #ff5f57; }
.yellow { background-color: #febc2e; }
.green  { background-color: #28c840; }

.piece {
  display: inline-block;
  width: 120px;
  margin: 18px 0px 0px 18px;
  color: #dddddd;
  font-size: 12px;
}

.thumb {
  height: 85px;
  margin-bottom: 6px;
  border-radius: 6px;
}

.pink  { background-color: #d9a9a9; }
.blue  { background-color: #8fb0d8; }
.green  { background-color: #a9c79a; }

.dock {
  position: absolute;
  left: 50%;
  margin-left: -215px;
  bottom: 14px;
  width: 415px;
  padding-left: 15px;
  height: 48px;
  background-color: rgba(255, 255, 255, 0.2);
  border-radius: 14px;
}

.icon {
  float: left;
  width: 34px;
  height: 34px;
  margin: 7px 3px;
  border-radius: 8px;
  color: white;
  font-size: 12px;
  font-weight: bold;
  line-height: 34px;
  text-align: center;
}

.icon:hover {
  margin-top: 0px;
}

</style>
</head>
