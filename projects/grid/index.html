<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grid Layout</title>
<style>

  body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: Georgia, serif;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    column-gap: 40px;
    row-gap: 60px;
    padding: 36px 40px;
  }

  .item {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .box {
    width: 100%;
    aspect-ratio: 400 / 535;
    background: #3a3a3a;
  }

  .label {
    margin-top: 12px;
    font-size: 1.3rem;
    text-align: center;
  }

</style>
</head>
<body>
  <div class="grid">
    <div class="item"><div class="box"></div><div class="label">Title 1</div></div>
    <div class="item"><div class="box"></div><div class="label">Title 2</div></div>
    <div class="item"><div class="box"></div><div class="label">Title 3</div></div>
    <div class="item"><div class="box"></div><div class="label">Title 4</div></div>
    <div class="item"><div class="box"></div><div class="label">Title 5</div></div>

    <div class="item"><div class="box"></div><div class="label">Title 6</div></div>
    <div class="item"><div class="box"></div><div class="label">Title 7</div></div>
    <div class="item"><div class="box"></div><div class="label">Title 8</div></div>
    <div class="item"><div class="box"></div><div class="label">Title 9</div></div>
    <div class="item"><div class="box"></div><div class="label">Title 10</div></div>

    <div class="item"><div class="box"></div><div class="label">Title 11</div></div>
    <div class="item"><div class="box"></div><div class="label">Title 12</div></div>
    <div class="item"><div class="box"></div><div class="label">Title 13</div></div>
    <div class="item"><div class="box"></div><div class="label">Title 14</div></div>
    <div class="item"><div class="box"></div><div class="label">Title 15</div></div>
  </div>
</body>
</html>
