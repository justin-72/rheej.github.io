<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Justin's Mobile Portfolio</title>
<style>

body {
  background-color: black;
  font-family: Arial, sans-serif;
  margin: 0;
}
a {text-decoration: none;}

.phone {
  position: absolute;
  top: 0px;
  bottom: 0px;
  left: 0px;
  right: 0px;
  width: 100%;
  max-width: 430px;
  margin: 0px auto;
  background-color: white;
  overflow: hidden;
}

.circle {
  width: 38px;
  height: 38px;
  margin: 18px 16px 0px 16px;
  background-color: #dcdcdc;
  border-radius: 50%;
  color: #666666;
  font-size: 18px;
  line-height: 38px;
  text-align: center;
}

.left  { float: left; }
.right { float: right; }

.search {
  clear: both;
  position: relative;
  height: 36px;
  margin: 80px 22px 0px 22px;
  background-color: #dcdcdc;
  border-radius: 18px;
  color: #666666;
  font-size: 16px;
  line-height: 36px;
}

.search .glass { position: absolute; left: 14px; }
.search .mic   { position: absolute; right: 14px; }

.grid {
  overflow: hidden;
  margin-top: 36px;
  padding: 0px 10px;
}

.cell {
  float: left;
  width: 33.33%;
  height: 114px;
}

.folder {
  position: relative;
  width: 82px;
  height: 58px;
  margin: 10px auto 0px auto;
  background-color: #8fd0fa;
  border-radius: 4px 6px 6px 6px;
  box-shadow: 0px 2px 3px rgba(0, 0, 0, 0.2);
}

.tab {
  position: absolute;
  top: -7px;
  left: 0px;
  width: 34px;
  height: 10px;
  background-color: #8fd0fa;
  border-radius: 5px 5px 0px 0px;
}

.cell:active .folder {
  opacity: 0.6;
}

.button {
  position: absolute;
  bottom: 30px;
  left: 0px;
  right: 0px;
  width: 68%;
  height: 58px;
  margin: 0px auto;
  background-color: #dcdcdc;
  border-radius: 29px;
}

.screen {
  display: none;
  position: absolute;
  top: 0px;
  left: 0px;
  width: 100%;
  height: 100%;
  background-color: white;
  z-index: 10;
  overflow: auto;
}

.screen:target {
  display: block;
}

.title {
  margin-top: 18px;
  font-size: 17px;
  font-weight: bold;
  line-height: 38px;
  text-align: center;
}

.list { margin-top: 24px; }

.row {
  overflow: hidden;
  padding: 12px 20px;
  border-bottom: 1px solid #eeeeee;
}

.thumb {
  float: left;
  width: 64px;
  height: 64px;
  margin-right: 14px;
  border-radius: 10px;
}

.name { margin-top: 12px; font-size: 16px; color: #111111; }
.type { margin-top: 4px; font-size: 13px; color: #888888; }
.pink { background-color: #d9a9a9; }
.blue { background-color: #8fb0d8; }
.green { background-color: #a9c79a; }

</style>
</head>

<body>

<div class="phone">

  <div class="circle left">&larr;</div>
  <div class="circle right">&middot;&middot;&middot;</div>

  <div class="search"><span class="glass">&#128269;</span><span class="mic">&#127908;</span></div>

  <div class="grid">
    <a class="cell" href="#s2025"><div class="folder"><div class="tab"></div></div></a>
    <a class="cell" href="#s2024"><div class="folder"><div class="tab"></div></div></a>
    <a class="cell" href="#s2023"><div class="folder"><div class="tab"></div></div></a>
    <a class="cell" href="#s2022"><div class="folder"><div class="tab"></div></div></a>
  </div>

  <div class="button"></div>

  <div class="screen" id="s2025">
    <a href="#" class="circle left">&larr;</a>
    <div class="title">2025</div>
    <div class="list">
      <div class="row"><div class="thumb pink"></div><div class="name">Project One</div><div class="type">Branding</div></div>
      <div class="row"><div class="thumb blue"></div><div class="name">Project Two</div><div class="type">Typography</div></div>
      <div class="row"><div class="thumb green"></div><div class="name">Project Three</div><div class="type">Posters</div></div>
    </div>
  </div>

  <div class="screen" id="s2024">
    <a href="#" class="circle left">&larr;</a>
    <div class="title">2024</div>
    <div class="list">
      <div class="row"><div class="thumb blue"></div><div class="name">Project One</div><div class="type">Branding</div></div>
      <div class="row"><div class="thumb pink"></div><div class="name">Project Two</div><div class="type">Typography</div></div>
      <div class="row"><div class="thumb green"></div><div class="name">Project Three</div><div class="type">Posters</div></div>
    </div>
  </div>

  <div class="screen" id="s2023">
    <a href="#" class="circle left">&larr;</a>
    <div class="title">2023</div>
    <div class="list">
      <div class="row"><div class="thumb green"></div><div class="name">Project One</div><div class="type">Branding</div></div>
      <div class="row"><div class="thumb pink"></div><div class="name">Project Two</div><div class="type">Typography</div></div>
    </div>
  </div>

  <div class="screen" id="s2022">
    <a href="#" class="circle left">&larr;</a>
    <div class="title">2022</div>
    <div class="list">
      <div class="row"><div class="thumb pink"></div><div class="name">Project One</div><div class="type">Branding</div></div>
      <div class="row"><div class="thumb blue"></div><div class="name">Project Two</div><div class="type">Typography</div></div>
      <div class="row"><div class="thumb green"></div><div class="name">Project Three</div><div class="type">Posters</div></div>
    </div>
  </div>

</div>

</body>
</html>
